services:
  ccbox:
    build: .
    container_name: ccbox
    working_dir: /workspace
    volumes:
      # 專案工作區 — host IDE 直接開 ./workspace/{project} 查看即時變動
      - ./workspace:/workspace
      # Claude Code 認證與設定（named volume 持久化，容器內登入）
      - claude-config:/home/ccbox/.claude
      - claude-json:/home/ccbox/.claude.json
      # Git 設定（named volume 持久化，容器內設定）
      - git-config:/home/ccbox/.gitconfig
      # GitHub CLI 認證持久化
      - gh-config:/home/ccbox/.config/gh
    env_file:
      - path: .env
        required: false
    environment:
      - SHELL=/bin/bash
    stdin_open: true
    tty: true

volumes:
  claude-config:
  claude-json:
  git-config:
  gh-config:
