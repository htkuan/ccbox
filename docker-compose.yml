services:
  ccbox:
    build: .
    image: ccbox
    container_name: ccbox
    working_dir: /workspace
    volumes:
      # 專案工作區 — host IDE 直接開 ./workspace/{project} 查看即時變動
      - ./workspace:/workspace
      # Claude Code 認證與設定
      - ./config/claude:/home/ccbox/.claude
      - ./config/claude.json:/home/ccbox/.claude.json
      # Git 設定（Git 原生支援 ~/.config/git/config）
      - ./config/git:/home/ccbox/.config/git
      # GitHub CLI 認證持久化
      - ./config/gh:/home/ccbox/.config/gh
    env_file:
      - path: .env
        required: false
    environment:
      - SHELL=/bin/bash
    stdin_open: true
    tty: true
